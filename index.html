<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enviar Petición a PC</title>
    <!-- SDK de Supabase para el navegador -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 350px; display: flex; flex-direction: column; gap: 15px; }
        label { font-size: 14px; font-weight: bold; color: #333; margin-bottom: -8px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        button { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.2s; }
        #btnGrabar { background: #e74c3c; color: white; }
        #btnGrabar.grabando { background: #c0392b; animation: pulse 1.5s infinite; }
        #btnEnviar { background: #2ecc71; color: white; display: none; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        #status { font-size: 14px; text-align: center; color: #666; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Enviar a PC</h2>
        
        <label for="campo1">Profesor:</label>
        <input type="text" id="campo1" placeholder="Ej: Juan Carlos Echeverry">
        
        <label for="campo2">Materia:</label>
        <input type="text" id="campo2" placeholder="Ej: Equinos / Reproducción">
        
        <button id="btnGrabar" onclick="toggleGrabacion()">🎙 Grabar Audio</button>
        <audio id="audioPlayback" controls style="display:none; width: 100%;"></audio>
        
        <button id="btnEnviar" onclick="enviarPeticion()">🚀 Enviar a Aplicación</button>
        <div id="status"></div>
    </div>

    <script>
        // CONFIGURACIÓN DE SUPABASE
        const SUPABASE_URL = 'https://rogfrmfhvanrbrhjeyzt.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_ARmpZsdwoh_WOty-qnmOsg_abb3QoVL';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let mediaRecorder;
        let audioChunks = [];
        let audioBlob = null;
        let grabando = false;

        async function toggleGrabacion() {
            const btnGrabar = document.getElementById('btnGrabar');
            const audioPlayback = document.getElementById('audioPlayback');
            const status = document.getElementById('status');

            if (!grabando) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = event => {
                        audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = () => {
                        audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        audioPlayback.src = audioUrl;
                        audioPlayback.style.display = 'block';
                        document.getElementById('btnEnviar').style.display = 'block';
                        status.textContent = "Audio grabado con éxito.";
                    };

                    mediaRecorder.start();
                    grabando = true;
                    btnGrabar.textContent = "⏹️ Detener Grabación";
                    btnGrabar.classList.add('grabando');
                    status.textContent = "Grabando voz...";
                } catch (err) {
                    alert("Error al acceder al micrófono: " + err);
                }
            } else {
                mediaRecorder.stop();
                grabando = false;
                btnGrabar.textContent = "🎙️ Grabar de nuevo";
                btnGrabar.classList.remove('grabando');
            }
        }

        async function enviarPeticion() {
            const texto1 = document.getElementById('campo1').value;
            const texto2 = document.getElementById('campo2').value;
            const status = document.getElementById('status');

            if (!texto1 || !texto2 || !audioBlob) {
                alert("Por favor completa los textos y graba un audio.");
                return;
            }

            status.textContent = "Subiendo archivo y enviando...";

            // 1. Subir audio a Supabase Storage
            const fileName = `audio_${Date.now()}.webm`;
            const { data: uploadData, error: uploadError } = await supabaseClient.storage
                .from('audios')
                .upload(fileName, audioBlob);

            if (uploadError) {
                status.textContent = "Error al subir audio: " + uploadError.message;
                return;
            }

            // Obtener URL pública del archivo
            const { data: publicUrlData } = supabaseClient.storage
                .from('audios')
                .getPublicUrl(fileName);

            const audioUrl = publicUrlData.publicUrl;

            // 2. Guardar registro en la tabla de Supabase
            const { error: dbError } = await supabaseClient
                .from('peticiones')
                .insert([{ texto1: texto1, texto2: texto2, audio_url: audioUrl, transcripcion: "Pendiente..." }]);

            if (dbError) {
                status.textContent = "Error al guardar en base de datos: " + dbError.message;
            } else {
                status.textContent = "¡Enviado con éxito a tu PC!";
                setTimeout(() => {
                    document.getElementById('campo1').value = '';
                    document.getElementById('campo2').value = '';
                    document.getElementById('audioPlayback').style.display = 'none';
                    document.getElementById('btnEnviar').style.display = 'none';
                    status.textContent = '';
                }, 3000);
            }
        }
    </script>
</body>
</html>
