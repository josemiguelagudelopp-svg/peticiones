<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Peticiones - Dashboard Académico</title>
    <!-- Tailwind CSS para un diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Cliente de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Header Principal -->
    <header class="bg-white shadow-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🎓</span>
                <h1 class="text-xl font-bold text-slate-900">Panel de Peticiones en Tiempo Real</h1>
            </div>
            <!-- Buscador -->
            <div class="w-full sm:w-auto">
                <input type="text" id="searchInput" placeholder="🔍 Buscar por profesor o materia..." 
                    class="w-full sm:w-80 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
        </div>
    </header>

    <!-- Contenedor Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Notificación flotante de estado -->
        <div id="notification" class="hidden mb-6 p-4 bg-blue-50 border-l-4 border-blue-500 text-blue-700 text-sm rounded shadow-sm transition-all">
            🔔 <span id="notifText">Sincronizando datos...</span>
        </div>

        <!-- Grid de Tarjetas de Peticiones -->
        <div id="cardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Las tarjetas se cargarán dinámicamente aquí -->
        </div>

        <!-- Estado vacío (si no hay registros) -->
        <div id="emptyState" class="hidden text-center py-16">
            <p class="text-4xl mb-2">📭</p>
            <p class="text-slate-500 font-medium">No hay peticiones registradas todavía.</p>
        </div>
    </main>

    <!-- Lógica de Conexión y Renderizado -->
    <script>
        // CONFIGURACIÓN DE SUPABASE
        const SUPABASE_URL = "https://rogfrmfhvanrbrhjeyzt.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ARmpZsdwoh_WOty-qnmOsg_abb3QoVL";
        
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let peticionesData = [];

        // Referencias a elementos del DOM
        const cardsContainer = document.getElementById('cardsContainer');
        const searchInput = document.getElementById('searchInput');
        const emptyState = document.getElementById('emptyState');
        const notification = document.getElementById('notification');

        function mostrarNotificacion(mensaje) {
            document.getElementById('notifText').innerText = mensaje;
            notification.classList.remove('hidden');
            setTimeout(() => {
                notification.classList.add('hidden');
            }, 4000);
        }

        // Cargar registros iniciales desde Supabase
        async function cargarPeticiones() {
            try {
                const { data, error } = await _supabase
                    .from('peticiones')
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                peticionesData = data || [];
                renderizarTarjetas(peticionesData);
            } catch (err) {
                console.error("Error al cargar peticiones:", err);
                mostrarNotificacion("Error al conectar con la base de datos.");
            }
        }

        // Renderizar las tarjetas en la interfaz
        function renderizarTarjetas(datos) {
            cardsContainer.innerHTML = '';

            if (datos.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            datos.forEach(reg => {
                const fecha = reg.created_at ? new Date(reg.created_at).toLocaleString() : 'Fecha reciente';
                const transcripcion = reg.transcripcion || "Pendiente de transcripción...";
                const colorTranscripcion = reg.transcripcion && reg.transcripcion !== "Pendiente de transcripción..." ? "text-emerald-700 font-medium" : "text-amber-600 italic";

                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm border border-slate-200 p-6 flex flex-col justify-between transition hover:shadow-md";
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3">
                            <span class="text-xs font-semibold px-2.5 py-1 bg-slate-100 text-slate-600 rounded-full">ID #${reg.id}</span>
                            <span class="text-xs text-slate-400">🕒 ${fecha}</span>
                        </div>
                        <h3 class="text-base font-bold text-slate-900 mb-1">👨‍🏫 ${reg.texto1 || 'Sin profesor'}</h3>
                        <p class="text-sm font-medium text-blue-600 mb-4">📖 ${reg.texto2 || 'Sin materia'}</p>
                        
                        <div class="bg-slate-50 p-3 rounded-lg border border-slate-100 mb-4">
                            <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Transcripción:</p>
                            <p class="text-sm ${colorTranscripcion}">${transcripcion}</p>
                        </div>
                    </div>

                    <div class="flex items-center justify-between pt-3 border-t border-slate-100 gap-2">
                        ${reg.audio_url ? `<a href="${reg.audio_url}" target="_blank" class="text-xs bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-md font-medium transition">🎧 Escuchar audio</a>` : '<span></span>'}
                        <button onclick="copiarTexto('${transcripcion.replace(/'/g, "\\'")}')" class="text-xs bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded-md font-medium transition">
                            📋 Copiar
                        </button>
                    </div>
                `;
                cardsContainer.appendChild(card);
            });
        }

        // Función para copiar texto al portapapeles
        function copiarTexto(texto) {
            navigator.clipboard.writeText(texto);
            mostrarNotificacion("¡Transcripción copiada al portapapeles!");
        }

        // Filtrar en tiempo real con la barra de búsqueda
        searchInput.addEventListener('input', (e) => {
            const termino = e.target.value.toLowerCase();
            const filtrados = peticionesData.filter(reg => {
                const profesor = String(reg.texto1 || '').toLowerCase();
                const materia = String(reg.texto2 || '').toLowerCase();
                const trans = String(reg.transcripcion || '').toLowerCase();
                return profesor.includes(termino) || materia.includes(termino) || trans.includes(termino);
            });
            renderizarTarjetas(filtrados);
        });

        // Configurar tiempo real (Supabase Realtime) para que se actualice solo
        function escucharCambiosEnTiempoReal() {
            _supabase
                .channel('public:peticiones')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'peticiones' }, payload => {
                    console.log('Cambio detectado en tiempo real:', payload);
                    mostrarNotificacion("¡Nueva actualización detectada en tiempo real!");
                    cargarPeticiones(); // Recarga automática de datos
                })
                .subscribe();
        }

        // Inicializar al cargar la página
        cargarPeticiones();
        escucharCambiosEnTiempoReal();
    </script>
</body>
</html>
